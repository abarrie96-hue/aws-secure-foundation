
name: ACME Financial CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Flask Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docker/ticket-005

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Application Files
        run: |
          pwd
          ls -la
          ls -la app/

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt pytest

      - name: Run Automated Tests
        run: python -m pytest tests/ -v

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t acme-flask:ci \
            ./docker/ticket-005

      - name: Verify Docker Image
        run: docker image inspect acme-flask:ci

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: acme-flask:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true